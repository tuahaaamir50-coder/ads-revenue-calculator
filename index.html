<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ads Revenue Calculator</title>
<style>
body{margin:0;padding:20px;background:#101512;color:#e8efe9;font-family:system-ui,sans-serif}
.box{max-width:560px;margin:auto}
h1{margin:0 0 6px}
.card{background:#18201b;border:1px solid #2a352d;border-radius:10px;padding:16px;margin:14px 0}
label{display:block;font-weight:600;margin:12px 0 4px}
input{width:100%;box-sizing:border-box;padding:11px;font-size:16px;color:#fff;background:#101512;border:1px solid #2a352d;border-radius:6px}
.big{font-size:40px;color:#4fd18a;font-weight:700}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #2a352d}
small{color:#9aa89e}
</style>
</head>
<body>
<div class="box">
<h1>Ads revenue calculator</h1>
<small>AdSense-style earnings estimate</small>
<div class="card">
<label>Page views per day</label>
<input id="pv" type="number" value="10000">
<label>Ad impressions per page</label>
<input id="ppp" type="number" value="2">
<label>CTR (%)</label>
<input id="ctr" type="number" step="any" value="1.5">
<label>CPC ($)</label>
<input id="cpc" type="number" step="any" value="0.30">
<label>Revenue share (%)</label>
<input id="share" type="number" value="68">
</div>
<div class="card">
<small>Estimated monthly earnings</small>
<div class="big" id="big">$0.00</div>
<small id="info"></small>
</div>
<div class="card">
<div class="row"><span>Daily</span><b id="d">$0.00</b></div>
<div class="row"><span>Monthly</span><b id="m">$0.00</b></div>
<div class="row"><span>Yearly</span><b id="y">$0.00</b></div>
</div>
<small>Estimates only. Month = 30 days, year = 365 days.</small>
</div>
<script>
var ids=["pv","ppp","ctr","cpc","share"];
function v(i){return parseFloat(document.getElementById(i).value)||0}
function usd(x){return "$"+x.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function calc(){
  var imps=v("pv")*v("ppp");
  var clicks=imps*v("ctr")/100;
  var daily=clicks*v("cpc")*v("share")/100;
  var rpm=v("pv")?daily/v("pv")*1000:0;
  document.getElementById("big").textContent=usd(daily*30);
  document.getElementById("d").textContent=usd(daily);
  document.getElementById("m").textContent=usd(daily*30);
  document.getElementById("y").textContent=usd(daily*365);
  document.getElementById("info").textContent="Page RPM "+usd(rpm)+" | "+Math.round(clicks)+" clicks/day";
}
ids.forEach(function(i){document.getElementById(i).addEventListener("input",calc)});
calc();
</script>
</body>
</html>
