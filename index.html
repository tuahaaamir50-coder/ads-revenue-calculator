
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ads Revenue Calculator</title>
<meta name="description" content="Free AdSense-style calculator to estimate daily, monthly, and yearly website advertising earnings.">
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#17201a;--mute:#5d6a61;--line:#dde3dc;--acc:#1a7f4b;--accbg:#e4f3ea;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#101512;--card:#18201b;--ink:#e8efe9;--mute:#9aa89e;--line:#2a352d;--acc:#4fd18a;--accbg:#1c3025;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
main{max-width:640px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:1.9rem;line-height:1.15;margin:0 0 6px}
p.sub{margin:0 0 22px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
label{display:block;font:600 .9rem system-ui,sans-serif;margin:0 0 4px}
.hint{font:.78rem system-ui,sans-serif;color:var(--mute);margin:3px 0 0}
input{width:100%;padding:11px 12px;font:1rem system-ui,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid .full{grid-column:1/-1}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
.big{font-size:2.6rem;line-height:1;margin:2px 0 4px;color:var(--acc)}
table{width:100%;border-collapse:collapse;font-family:system-ui,sans-serif}
td,th{padding:10px 4px;border-bottom:1px solid var(--line);text-align:right;font-size:.95rem}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--mute);font-size:.8rem}
tr:last-child td{border-bottom:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;font:.85rem system-ui,sans-serif}
.chip{background:var(--accbg);color:var(--acc);padding:5px 10px;border-radius:99px;font-weight:600}
footer{font:.78rem system-ui,sans-serif;color:var(--mute)}
</style>
</head>
<body>
<main>
<h1>Ads revenue calculator</h1>
<p class="sub">Estimate your website's AdSense-style earnings from traffic, click-through rate, and cost per click.</p>

<section class="card" aria-label="Inputs">
<div class="grid">
<div class="full">
<label for="pv">Page views per day</label>
<input id="pv" type="number" inputmode="decimal" min="0" step="any" value="10000">
</div>
<div>
<label for="ppp">Ad impressions per page</label>
<input id="ppp" type="number" inputmode="decimal" min="0" step="any" value="2">
<p class="hint">Ad units shown on each page</p>
